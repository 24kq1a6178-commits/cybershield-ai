<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield AI - Security Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #1b0879;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
        }
        
        header h1 {
            font-size: 3rem;
            background: linear-gradient(90deg, #17084b, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        header p {
            color: #240c50;
            font-size: 1.2rem;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
            padding: 20px 40px;
            background: rgba(26, 3, 56, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-item .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #0f0423;
        }
        
        .stat-item .label {
            color: #270958;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .scan-form-container {
            background: rgba(21, 9, 53, 0.05);
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            border: 1px solid rgba(24, 5, 58, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .scan-form-container h2 {
            margin-bottom: 25px;
            color: #250d68;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2a0f60;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(9, 16, 91, 0.1);
            border-radius: 10px;
            background: rgba(13, 3, 3, 0.3);
            color: #1e0957;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #18055f;
        }
        
        .form-group select option {
            background: #0d0d72;
        }
        
        .btn-scan {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #280e71, #3a7bd5);
            color: #331b74;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn-scan:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3);
        }
        
        .btn-scan:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 210, 255, 0.2);
            border-top-color: #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .results-container {
            display: none;
            margin-top: 30px;
        }
        
        .results-container.active {
            display: block;
        }
        
        .result-card {
            background: +rgba(7, 6, 60, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid #3b0977;
        }
        
        .result-card.critical { border-left-color: #55072e75; }
        .result-card.high { border-left-color: #1c0fc7; }
        .result-card.medium { border-left-color: #060538; }
        .result-card.low { border-left-color: #75083b; }
        
        .risk-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .risk-badge.critical { background: #9d0654; color: #fff; }
        .risk-badge.high { background: #074ba4; color: #fff; }
        .risk-badge.medium { background: #0c043b; color: #000; }
        .risk-badge.low { background: #4a023353; color: #000; }
        
        .vuln-item {
            background: rgba(42, 11, 153, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
        }
        
        .vuln-item h4 {
            color: #2912dd;
            margin-bottom: 10px;
        }
        
        .vuln-item p {
            color: #0f40e0;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        .vuln-item .recommendation {
            background: rgba(9, 28, 238, 0.801);
            border-radius: 8px;
            padding: 12px;
            border-left: 3px solid #120be0;
        }
        
        .vuln-item .recommendation strong {
            color: #1724db;
        }
        
        .recent-scans {
            margin-top: 40px;
        }
        
        .recent-scans h2 {
            margin-bottom: 20px;
            color: #2650ea;
        }
        
        .scan-list {
            list-style: none;
        }
        
        .scan-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(21, 4, 57, 0.03);
            border-radius: 10px;
            margin-bottom: 10px;
            border: #3a7bd5;
        }
