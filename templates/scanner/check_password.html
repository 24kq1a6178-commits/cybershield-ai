{% extends 'base.html' %}
{% block title %}Check Password — CyberShield AI{% endblock %}

{% block content %}
<div class="container">

    <section class="hero">
        <h1>🔑 Password Strength</h1>
        <p>Type a password to see how strong it is — nothing is stored or sent.</p>
    </section>

    <form class="form-card" id="pwd-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="password-input">Password</label>
            <input type="password" id="password-input" name="password" placeholder="Enter a password…" autofocus>
        </div>

        <div class="strength-meter">
            <div class="strength-bar" id="strength-bar"></div>
        </div>
        <p id="strength-label" style="font-weight:600; margin-bottom:20px;"></p>

        <button type="submit" class="btn btn-primary" style="width:100%;">Analyze Password</button>
    </form>

    <div id="results" style="margin-top:30px;"></div>

</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('pwd-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pwd = document.getElementById('password-input').value;
    const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;
    const results = document.getElementById('results');

    if (!pwd) {
        results.innerHTML = `<div class="result-card dangerous"><h3>Enter a password first</h3></div>`;
        return;
    }

    try {
        const res = await fetch("{% url 'scanner:check_password' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrf,
            },
            body: JSON.stringify({ password: pwd }),
        });
        const data = await res.json();

        if (data.error) {
            results.innerHTML = `<div class="result-card dangerous"><h3>Error</h3><p>${data.error}</p></div>`;
            return;
        }

        const r = data.results || {};
        const verdict = r.risk_level || 'safe';
        let html = `
            <div class="result-card ${verdict}">
                <h2>Password Score <span class="badge ${verdict}">${r.risk_level.toUpperCase()}</span></h2>
                <p style="margin-top:10px;">Score: <strong>${r.score || 0}/100</strong></p>
            </div>
        `;

        if (r.suggestions && r.suggestions.length) {
            html += '<h2 class="section-title">💡 Suggestions</h2>';
            for (const s of r.suggestions) {
                html += `<div class="vuln-item"><p>${s}</p></div>`;
            }
        }

        results.innerHTML = html;
    } catch (err) {
        results.innerHTML = `<div class="result-card dangerous"><h3>Network Error</h3><p>${err.message}</p></div>`;
    }
});
</script>
{% endblock %}
