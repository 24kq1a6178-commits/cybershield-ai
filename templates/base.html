{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CyberShield AI{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-inner">
            <a href="{% url 'core:home' %}" class="nav-logo">🛡️ CyberShield AI</a>
            <ul class="nav-links">
                <li><a href="{% url 'core:home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a></li>
                <li><a href="{% url 'scanner:scan_url' %}">Scanner</a></li>
                <li><a href="{% url 'core:help' %}" class="{% if request.resolver_match.url_name == 'help' %}active{% endif %}">Help</a></li>
                <li><a href="{% url 'core:about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© {% now "Y" %} CyberShield AI — Smart Digital Safety System</p>
        <p style="margin-top:8px;">
            <a href="{% url 'core:about' %}">About</a> ·
            <a href="{% url 'core:help' %}">Help</a> ·
            <a href="{% url 'core:home' %}">Home</a>
        </p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
